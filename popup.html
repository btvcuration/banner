<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-dark: #1a1d29; --bg-card: #242736;
            --text-main: #ffffff; --text-sub: #9ca3af;
            --accent-purple: #9da0f2; --border-color: #374151; --accent-red: #e15255;
        }
        body { width: 100%; height: 100vh; margin: 0; font-family: 'Malgun Gothic', sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; overflow: hidden; }
        
        .content-area { flex: 1; overflow-y: auto; padding: 15px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: var(--bg-card); border-radius: 8px; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        
        .filter-group { display: flex; gap: 8px; font-size: 11px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .filter-group label { cursor: pointer; display: flex; align-items: center; gap: 3px; }
        input[type="checkbox"], input[type="radio"] { cursor: pointer; margin:0;}
        
        .calendar-container { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 5px; }
        .cal-box { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 2px; text-align: center; cursor: pointer; min-width: 45px; transition: all 0.2s;}
        .cal-box:hover { background: rgba(157, 160, 242, 0.1); border-color: var(--accent-purple); }
        .cal-box.active { background: var(--accent-purple); color: #1a1d29; border-color: var(--accent-purple); }
        .cal-date { font-size: 10px; margin-bottom: 2px; font-weight: bold; }
        .cal-count { font-size: 14px; font-weight: bold; }
        
        .list-item { background: rgba(0,0,0,0.2); border-radius: 6px; padding: 10px; margin-bottom: 8px; border: 1px solid var(--border-color); cursor: pointer; display: flex; align-items: center; }
        .list-item:hover { border-color: var(--accent-purple); }
        .list-poster { width: 40px; height: 58px; background: #333; border-radius: 4px; margin-right: 12px; object-fit: cover; }
        .list-info { flex: 1; overflow: hidden; }
        .list-title { font-weight: bold; font-size: 13px; margin-bottom: 4px; display:flex; align-items:center; gap:5px; white-space: nowrap; text-overflow: ellipsis; }
        .list-sub { color: var(--text-sub); font-size: 11px; }
        
        .detail-box { display: none; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 12px; margin-bottom: 12px; border: 1px dashed var(--border-color); font-size: 12px; color: #ddd; }
        .detail-row { margin-bottom: 6px; line-height: 1.4; }
        .detail-title { color: var(--accent-purple); font-weight: bold; display: inline-block; width: 80px; }
        
        .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; background: #444; margin-right: 4px; }
        .badge-ok { background: #198754; color: white; }
        .badge-warn { background: #ffc107; color: black; }
        .badge-err { background: #dc3545; color: white; }
        .badge-uhd { background: #8a2be2; color: white; }
        
        .search-box { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-dark); color: white; font-size: 13px; box-sizing: border-box; }
        .search-btn { width: 100%; padding: 10px; margin-top: 8px; background: var(--accent-purple); color: #1a1d29; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .input-section { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .col { flex: 1; }
        h4 { margin: 0 0 6px 0; font-size: 12px; color: var(--text-main); }
        textarea { width: 100%; height: 50px; padding: 6px; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-dark); color: white; resize: none; font-size: 11px; }
        .run-btn { width: 100%; padding: 10px; cursor: pointer; background: var(--accent-red); color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; background: var(--bg-card); table-layout: fixed; border: 1px solid var(--border-color); }
        th, td { border: 1px solid var(--border-color); padding: 6px; text-align: left; }
        th { background: rgba(0,0,0,0.3); font-weight: bold; text-align: center; }
        .url-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--accent-purple); }
        .thumb { height: 20px; vertical-align: middle; margin-right: 4px; border-radius: 2px; cursor:pointer;}
        
        .action-btns { display: flex; gap: 8px; margin-top: 10px; }
        .copy-btn, .clear-btn { padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; border: none; color: white; font-size: 11px; }
        .copy-btn { background: #007bff; flex: 2; }
        .clear-btn { background: #6c757d; flex: 1; }
        
        .bottom-nav { display: flex; background: var(--bg-card); border-top: 1px solid var(--border-color); }
        .nav-item { flex: 1; padding: 12px 0; text-align: center; color: var(--text-sub); cursor: pointer; font-size: 13px; font-weight: bold; transition: all 0.2s;}
        .nav-item:hover { color: white; background: rgba(255,255,255,0.05); }
        .nav-item.active { color: var(--text-main); background-color: rgba(157, 160, 242, 0.15); border-top: 2px solid var(--accent-purple); }

        .price-detail-btn { background: var(--border-color); color: white; border: none; padding: 2px 6px; font-size: 10px; border-radius: 4px; cursor: pointer; margin-left: 5px; }
        .price-detail-box { display: none; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 4px; margin-top: 6px; font-size: 11px; border: 1px solid var(--border-color); }
        
        .ep-link { cursor: pointer; color: var(--accent-purple); text-decoration: underline; margin-right: 6px; transition: color 0.2s; }
        .ep-link:hover { color: white; }
        .ep-link.active { font-weight: bold; color: var(--accent-red); text-decoration: none; }
    </style>
</head>
<body>
    <div id="wrongPageOverlay" style="display:none; position:absolute; top:0; left:0; right:0; bottom:0; background:var(--bg-dark); z-index:9999; padding:20px; text-align:center; flex-direction:column; justify-content:center;">
        <h3 style="color:var(--accent-purple); margin-bottom:10px;">데이터 로딩 불가 ⚠️</h3>
        <p style="font-size:12px; color:var(--text-sub); margin-bottom: 25px; line-height:1.5;">현재 페이지에서는 데이터를 불러올 수 없습니다.<br>플로팅 창을 유지한 채 타이틀 목록 화면으로 이동할까요?</p>
        <button id="movePageBtn" style="padding:12px; background:var(--accent-purple); color:#1a1d29; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">타이틀 관리로 이동</button>
    </div>
    
    <div class="content-area">
        <!-- 기존 대시보드 탭 -->
        <div id="tab-dashboard" class="tab-content active">
            <div class="card">
                <div class="filter-group">
                    <label><input type="checkbox" id="selectAllCats" checked> 전체</label>
                    <label><input type="checkbox" class="cat-filter" value="영화" checked> 영화</label>
                    <label><input type="checkbox" class="cat-filter" value="드라마" checked> 드라마</label>
                    <label><input type="checkbox" class="cat-filter" value="예능" checked> 예능</label>
                    <label><input type="checkbox" class="cat-filter" value="애니" checked> 애니</label>
                    <label><input type="checkbox" class="cat-filter" value="키즈" checked> 키즈</label>
                    <label><input type="checkbox" class="cat-filter" value="기타" checked> 기타</label>
                    <label style="color:#ff6b6b;"><input type="checkbox" class="cat-filter" value="성인"> 성인</label>
                    <label style="margin-left:auto; color:var(--accent-red);"><input type="checkbox" id="posterMissingFilter"> 포스터 누락</label>
                </div>
                <div class="calendar-container" id="calendarView">
                    <div style="font-size:12px; color:var(--text-sub); padding:10px;">D-7 데이터를 불러옵니다...</div>
                </div>
            </div>
            <div id="dashboardListArea">
                <div style="text-align:center; padding: 20px; color: var(--text-sub); font-size: 12px;">조건에 맞는 데이터가 없습니다.</div>
            </div>
        </div>

        <!-- 기존 검색 탭 -->
        <div id="tab-search" class="tab-content">
            <div class="card">
                <div class="filter-group" style="margin-bottom:8px;">
                    <label><input type="radio" name="schType" value="title" checked> 단편 (영화 등)</label>
                    <label><input type="radio" name="schType" value="season"> 시즌 (방송 등)</label>
                </div>
                <input type="text" id="searchInput" class="search-box" placeholder="일반 VOD 검색어 입력">
                <button id="searchBtn" class="search-btn">검색하기</button>
            </div>
            <div id="searchResults" style="margin-top: 10px;"></div>
        </div>

        <!-- 기존 포스터 파싱 탭 -->
        <div id="tab-poster" class="tab-content">
            <div class="input-section">
                <div class="col">
                    <h4>단편 키워드 (엔터로 구분)</h4>
                    <textarea id="titleKeywords"></textarea>
                </div>
                <div class="col">
                    <h4>시즌 키워드 (엔터로 구분)</h4>
                    <textarea id="seasonKeywords"></textarea>
                </div>
            </div>
            <button id="runPosterBtn" class="run-btn">포스터 일괄 추출</button>
            <div id="posterStatus" style="text-align: center; font-size: 11px; margin-top: 8px; color:#aaa;"></div>
            <div id="resultSection" style="display:none;">
                <table>
                    <colgroup><col width="10%"><col width="30%"><col width="20%"><col width="20%"><col width="20%"></colgroup>
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll" checked></th>
                            <th>콘텐츠명</th>
                            <th>본편 ID</th>
                            <th>가로</th>
                            <th>세로</th>
                        </tr>
                    </thead>
                    <tbody id="resultBody"></tbody>
                </table>
                <div class="action-btns">
                    <button id="copyBtn" class="copy-btn">클립보드 복사</button>
                    <button id="clearBtn" class="clear-btn">선택 삭제</button>
                </div>
            </div>
        </div>

        <!-- 가격 변동 탭 개선 -->
        <div id="tab-pricedrop" class="tab-content">
            <div class="card">
                <div class="filter-group">
                    <label><input type="checkbox" id="pd-selectAllCats" checked> 전체</label>
                    <label><input type="checkbox" class="pd-cat-filter" value="200" checked> 해외영화</label>
                    <label><input type="checkbox" class="pd-cat-filter" value="C136" checked> 해외영화애니</label>
                    <label><input type="checkbox" class="pd-cat-filter" value="100" checked> 한국영화</label>
                    <label><input type="checkbox" class="pd-cat-filter" value="C135" checked> 한국영화애니</label>
                </div>
                <!-- 필터 한 줄 통합 -->
                <div class="filter-group" style="margin-top:5px; border-top:1px solid var(--border-color); padding-top:8px; justify-content: flex-start; gap: 15px;">
                    <label>기간: 
                        <select id="pd-date-filter" style="background:var(--bg-dark); color:white; border:1px solid var(--border-color); border-radius:4px;">
                            <option value="7">D+7</option>
                            <option value="14" selected>D+14</option>
                            <option value="21">D+21</option>
                            <option value="28">D+28</option>
                        </select>
                    </label>
                    <label>관객(이상): 
                        <input type="number" id="pd-aud-filter" value="0" style="width:55px; background:var(--bg-dark); color:white; border:1px solid var(--border-color); border-radius:4px; padding:2px;">명
                    </label>
                    <label>타겟대여가: 
                        <input type="number" id="pd-price-filter" value="5000" style="width:55px; background:var(--bg-dark); color:white; border:1px solid var(--border-color); border-radius:4px; padding:2px;">원
                    </label>
                </div>
            </div>
            
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; gap:8px;">
                <button id="pd-scan-btn" class="run-btn" style="flex:2; background:var(--accent-purple); color:#1a1d29;">전체 데이터 스캔 🔄</button>
                <button id="pd-copy-btn" class="copy-btn" style="flex:1;">결과 복사</button>
            </div>
            
            <div id="pd-status" style="text-align:center; font-size:11px; color:var(--text-sub); margin-bottom:8px;">탭 진입 시 자동으로 전체 스캔을 시작합니다.</div>
            
            <div id="pd-result-area" style="display:flex; flex-direction:column; gap:8px;">
                <!-- 검색 결과 리스트 렌더링 영역 -->
            </div>
        </div>
        <!-- [신규 추가] 엑셀 추출 탭 시작 -->
        <!-- [신규 수정] 엑셀 추출 탭 시작 -->
        <div id="tab-excel" class="tab-content">
            <div class="card">
                <h4 style="color:var(--accent-purple); margin-bottom:10px;">📊 최근 편성 엑셀 추출</h4>
                <div style="font-size: 11px; color: var(--text-sub); margin-bottom: 12px;">
                    해당 기간 내 실서버에 편성(배포승인) 완료된 타이틀을 추출합니다.
                </div>
                
                <!-- 기간 설정 UI -->
                <div style="display: flex; gap: 8px; margin-bottom: 15px; align-items: center;">
                    <input type="date" id="exStartDt" style="flex:1; background:var(--bg-dark); color:white; border:1px solid var(--border-color); border-radius:4px; padding:6px; font-size:11px;">
                    <span style="color: var(--text-sub); font-weight:bold;">~</span>
                    <input type="date" id="exEndDt" style="flex:1; background:var(--bg-dark); color:white; border:1px solid var(--border-color); border-radius:4px; padding:6px; font-size:11px;">
                </div>

                <!-- 💡 버튼 분리: 검색 버튼과 추출/복사 버튼 -->
                <div style="display:flex; justify-content:space-between; gap:8px;">
                    <button id="searchExcelBtn" class="run-btn" style="flex:1; background:#007bff; color:white; padding:10px;">1. 대상 검색</button>
                    <button id="runExcelBtn" class="run-btn" style="flex:1; background:#10b981; color:white; padding:10px;" disabled>2. 추출 및 복사</button>
                </div>
            </div>
            
            <div id="excelStatus" style="text-align: center; font-size: 11px; margin-top: 15px; color: var(--text-sub); line-height: 1.5; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 6px;">
                기간 설정 후 [대상 검색]을 먼저 눌러주세요.
            </div>
            <div id="excelResultArea" style="max-height: 250px; overflow-y: auto; margin-top: 10px; font-size: 11px;"></div>
        </div>

    </div>

    <div class="bottom-nav">
        <div class="nav-item active" data-target="tab-dashboard">대시보드</div>
        <div class="nav-item" data-target="tab-search">통합 검색</div>
        <div class="nav-item" data-target="tab-poster">포스터 파싱</div>
        <!-- 가격 변동 네비게이션 아이템 추가 -->
        <div class="nav-item" data-target="tab-pricedrop">가격 변동</div>
        <div class="nav-item" data-target="tab-excel">엑셀추출</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
